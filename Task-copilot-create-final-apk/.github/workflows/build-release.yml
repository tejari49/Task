name: Build Release APK

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger bei Tags wie v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z.B. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Dependencies
        run: |
          npm ci
          npm install @capacitor/push-notifications
      
      - name: Create .env.local from Secrets
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" >> .env.local
          echo "VITE_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env.local
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY }}" >> .env.local
      
      - name: Update Version in build.gradle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE=$(echo $VERSION | sed 's/\.//g')
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION\"/" android/app/build.gradle
      
      - name: Build Web Assets
        run: npm run build
      
      - name: Sync Capacitor
        run: npx cap sync android
      
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew
      
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease
      
      - name: Sign APK (Optional - wenn Keystore vorhanden)
        if: ${{ secrets.KEYSTORE_FILE != '' }}
        run: |
          echo "Signing APK..."
          # Keystore signing würde hier passieren
          # Benötigt: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD als Secrets
      
      - name: Copy APK to Output
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk/taskrai-v${{ steps.version.outputs.version }}.apk
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskrai-release-v${{ steps.version.outputs.version }}
          path: apk/taskrai-v${{ steps.version.outputs.version }}.apk
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apk/taskrai-v${{ steps.version.outputs.version }}.apk
          name: TaskRai v${{ steps.version.outputs.version }}
          body: |
            ## TaskRai v${{ steps.version.outputs.version }}
            
            ### 📱 Android APK
            - Debug APK für Testing
            - Google Login aktiviert
            - Push Notifications aktiviert
            
            ### 📥 Installation
            1. APK herunterladen
            2. Auf Android-Gerät übertragen
            3. Installation erlauben (Unbekannte Quellen)
            4. App öffnen & Google Login nutzen
            
            ### ⚠️ Hinweis
            Dies ist eine unsigned/debug APK. Für Production sollte die APK signiert werden.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: APK Info
        run: |
          echo "✅ Release APK Build erfolgreich!"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Dateigröße: $(du -h apk/taskrai-v${{ steps.version.outputs.version }}.apk | cut -f1)"
          echo "MD5: $(md5sum apk/taskrai-v${{ steps.version.outputs.version }}.apk | cut -d' ' -f1)"
