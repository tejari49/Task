name: Unpack ZIP into repo
on:
  push:
    paths:
      - 'zips/**.zip'
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to zip file in repo (relative), e.g. zips/archive.zip'
        required: false
        default: 'zips/archive.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure unzip is installed
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Determine ZIP path
        id: vars
        run: |
          set -euo pipefail
          ZIP=""
          if [ "${{ github.event_name }}" = "push" ]; then
            ZIP=$(git diff --name-only HEAD^ HEAD | grep -E '\.zip$' | head -n1 || true)
            if [ -z "$ZIP" ]; then
              ZIP=$(git ls-files '*.zip' | head -n1 || true)
            fi
          else
            ZIP="${{ github.event.inputs.zip_path }}"
          fi
          echo "zip_path=${ZIP}" >> $GITHUB_OUTPUT

      - name: Fail if no ZIP found
        if: steps.vars.outputs.zip_path == ''
        run: |
          echo "No zip file found to unzip. Provide one under zips/ or specify zip_path on workflow_dispatch."
          exit 1

      - name: Unpack archive into repo root
        run: |
          set -euo pipefail
          ZIP="${{ steps.vars.outputs.zip_path }}"
          echo "Unzipping: $ZIP"
          TMPDIR=$(mktemp -d)
          unzip -o "$ZIP" -d "$TMPDIR"
          cp -r "$TMPDIR/." .
          rm -rf "$TMPDIR"

      - name: Commit & push extracted files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unpack ${{ steps.vars.outputs.zip_path }} via GitHub Actions"
          git push
