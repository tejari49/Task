name: Unzip pung-pong.zip to root (PR)

on:
  push:
    branches: ["main"]
    paths:
      - "pung-pong.zip"
      - "Task/pung-pong.zip"
      - "**/pung-pong.zip"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unzip-pung-pong-pr
  cancel-in-progress: true

jobs:
  unzip_to_root_pr:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install unzip + rsync
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Find pung-pong.zip
        id: pick
        run: |
          set -euo pipefail

          ZIP_PATH=""
          for p in "pung-pong.zip" "Task/pung-pong.zip"; do
            if [[ -f "$p" ]]; then ZIP_PATH="$p"; break; fi
          done

          if [[ -z "$ZIP_PATH" ]]; then
            ZIP_PATH="$(git ls-files | grep -E '(^|/)pung-pong\.zip$' | head -n 1 || true)"
          fi

          if [[ -z "$ZIP_PATH" ]]; then
            echo "pung-pong.zip not found" >&2
            exit 1
          fi

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_PATH"

      - name: Unzip -> root (flatten if single top-level folder)
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.pick.outputs.zip_path }}"
          WORK="${RUNNER_TEMP}/unzip_work"

          rm -rf "$WORK"
          mkdir -p "$WORK"

          unzip -q -o "$ZIP_PATH" -d "$WORK"

          shopt -s dotglob nullglob
          entries=("$WORK"/*)

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            SRC="${entries[0]}"
          else
            SRC="$WORK"
          fi

          # Merge/overwrite into repo root
          rsync -a "${SRC}/" "./"

          git status --porcelain || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: "auto/unzip-pung-pong"
          delete-branch: true
          commit-message: "Unzip pung-pong.zip to repository root"
          title: "Unzip pung-pong.zip to repository root"
          body: |
            Automatically unzipped `${{ steps.pick.outputs.zip_path }}` into the repository root.