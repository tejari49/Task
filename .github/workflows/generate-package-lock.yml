name: Generate package-lock.json for Task-copilot-create-final-apk

# Generiert automatisch eine neue package-lock.json, wenn package.json geändert wird
on:
  push:
    branches: ["main", "master"]
    paths:
      - "Task-copilot-create-final-apk/package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-lock:
    # Verhindert Endlosschleifen, wenn der Bot den Commit auslöst
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node (ohne Cache, weil lockfile fehlt)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📦 Erzeuge package-lock.json (nur lockfile)
        working-directory: Task-copilot-create-final-apk
        run: |
          npm install --package-lock-only --no-audit --no-fund

      - name: 🔨 Commit und push, falls sich etwas geändert hat
        run: |
          # Prüfen, ob sich die package-lock.json geändert hat
          if git diff --quiet -- Task-copilot-create-final-apk/package-lock.json; then
            echo "package-lock.json unverändert."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Task-copilot-create-final-apk/package-lock.json
          git commit -m "chore: auto-generate package-lock.json for Task-copilot-create-final-apk [skip ci]"
          git push
