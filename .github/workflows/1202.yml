name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Task-copilot-create-final-apk/package-lock.json

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies (ci if lock exists, else install)
        working-directory: Task-copilot-create-final-apk
        run: |
          set -euo pipefail
          echo "[INFO] Node: $(node -v)"
          echo "[INFO] NPM : $(npm -v)"
          if [ -f package-lock.json ]; then
            echo "[INFO] package-lock.json found -> npm ci"
            npm ci
          else
            echo "[WARN] package-lock.json missing -> npm install (and generating lock)"
            npm install
            echo "[INFO] Generated lockfile:"
            ls -la package-lock.json || true
          fi

      - name: ⚡ Build web assets (z.B. Vite -> dist)
        working-directory: Task-copilot-create-final-apk
        run: |
          set -euo pipefail
          echo "[INFO] Building web assets..."
          npm run build
          echo "[INFO] dist contents:"
          ls -la dist || true
          test -f dist/index.html

      - name: 🌀 Capacitor Android sync
        working-directory: Task-copilot-create-final-apk
        run: |
          set -euo pipefail
          echo "[INFO] Syncing capacitor plugins..."
          npx cap sync android

      - name: 🗝️ Make Gradlew executable
        run: chmod +x Task-copilot-create-final-apk/android/gradlew

      - name: 🛠️ Build Debug APK
        working-directory: Task-copilot-create-final-apk/android
        run: |
          set -euo pipefail
          echo "[INFO] Building Debug APK..."
          ./gradlew --no-daemon assembleDebug

      - name: 🚚 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskrai-debug-apk
          path: Task-copilot-create-final-apk/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
