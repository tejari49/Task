name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Task-copilot-create-final-apk/package-lock.json

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Installing dependencies..."
          npm ci

      - name: ⚡ Build web assets (z.B. Vite -> dist)
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Building web assets..."
          npm run build
          ls -la dist
          test -f dist/index.html

      - name: 🌀 Capacitor Android sync
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Syncing capacitor plugins..."
          npx cap sync android

      - name: 🗝️ Make Gradlew executable
        run: chmod +x Task-copilot-create-final-apk/android/gradlew

      - name: 🛠️ Build Debug APK
        working-directory: Task-copilot-create-final-apk/android
        run: |
          echo "[INFO] Building Debug APK..."
          ./gradlew assembleDebug

      - name: 🚚 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskrai-debug-apk
          path: Task-copilot-create-final-apk/android/app/build/outputs/apk/debug/*.apk
