name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      # Abhängigkeiten installieren: Wenn kein gültiges lockfile vorhanden ist,
      # erzeugen wir ein neues via npm install, sonst verwenden wir npm ci.
      - name: 📦 Install dependencies
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Prüfe package-lock.json..."
          if [ ! -f package-lock.json ]; then
            echo "[WARN] Keine package-lock.json gefunden. Erzeuge neue via npm install ..."
            npm install --no-audit --no-fund
          else
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json'));if(!p.lockfileVersion||p.lockfileVersion<1){process.exit(1);}" && VALID=1 || VALID=0
            if [ "$VALID" -eq 1 ]; then
              echo "[INFO] Gültige package-lock.json vorhanden -> npm ci"
              npm ci
            else
              echo "[WARN] package-lock.json ungültig -> npm install (lockfile wird neu generiert)"
              rm -f package-lock.json
              npm install --no-audit --no-fund
            fi
          fi

      - name: ⚡ Build web assets (z.B. Vite -> dist)
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Build web assets..."
          npm run build
          ls -la dist
          test -f dist/index.html

      - name: 🌀 Capacitor Android sync
        working-directory: Task-copilot-create-final-apk
        run: |
          echo "[INFO] Syncing capacitor plugins..."
          npx cap sync android

      - name: 🗝️ Make Gradlew executable
        run: chmod +x Task-copilot-create-final-apk/android/gradlew

      - name: 🛠️ Build Debug APK
        working-directory: Task-copilot-create-final-apk/android
        run: |
          echo "[INFO] Building Debug APK..."
          ./gradlew --no-daemon assembleDebug

      - name: 🚚 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskrai-debug-apk
          path: Task-copilot-create-final-apk/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
