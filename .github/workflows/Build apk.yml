name: Build TaskRai APK (Debug)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORKDIR: Task-copilot-create-final-apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (npm)
        working-directory: ${{ env.WORKDIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web assets (create ./dist)
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -e
          echo "==> repo content"
          ls -la

          # 1) If a build script exists, run it (Vite/React/Angular/etc.)
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            echo "==> npm run build"
            npm run build
          else
            echo "==> Kein npm script 'build' gefunden – baue dist als Fallback."
          fi

          # 2) Hard guarantee: Capacitor needs webDir (often 'dist') with an index.html.
          mkdir -p dist

          # If build did not generate dist/index.html, create a minimal dist from existing sources.
          if [ ! -f dist/index.html ]; then
            echo "==> dist/index.html fehlt – erstelle Fallback index.html"

            # Prefer Vite-style root index.html
            if [ -f index.html ]; then
              cp index.html dist/index.html
            # Or single-file app variant
            elif [ -f TimeRoster.html ]; then
              cp TimeRoster.html dist/index.html
            # Or static web root
            elif [ -f public/index.html ]; then
              cp public/index.html dist/index.html
            else
              echo "ERROR: Keine index.html/TimeRoster.html gefunden. Lege eine index.html an oder setze webDir korrekt."
              exit 1
            fi
          fi

          # Copy common static assets if present (service worker MUST be at web root)
          if [ -d public ]; then
            cp -R public/* dist/ || true
          fi

          echo "==> dist content"
          ls -la dist

      - name: Capacitor sync Android
        working-directory: ${{ env.WORKDIR }}
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x ${{ env.WORKDIR }}/android/gradlew

      - name: Build Debug APK
        working-directory: ${{ env.WORKDIR }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskrai-debug-apk
          path: ${{ env.WORKDIR }}/android/app/build/outputs/apk/debug/*.apk
