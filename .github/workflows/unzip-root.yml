name: Unzip ZIP aus Repo-Root

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP-Dateiname im Repo-Root (optional; sonst erste *.zip)"
        required: false
        default: ""
      commit_changes:
        description: "Entpackte Dateien ins Repo committen? (true/false)"
        required: false
        default: "false"
      delete_zip:
        description: "ZIP nach Entpacken löschen? (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  unzip:
    # verhindert Endlosschleife, falls du commit_changes=true nutzt
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      ZIP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.zip_name || '' }}
      COMMIT_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_changes || 'false' }}
      DELETE_ZIP: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_zip || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tools sicherstellen (unzip, rsync)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: ZIP auswählen
        id: pick
        run: |
          set -euo pipefail

          if [[ -n "${ZIP_INPUT}" ]]; then
            if [[ ! -f "${ZIP_INPUT}" ]]; then
              echo "❌ ZIP '${ZIP_INPUT}' nicht gefunden im Repo-Root." >&2
              echo "Repo-Root Inhalt:" >&2
              ls -la >&2
              exit 1
            fi
            ZIP_FILE="${ZIP_INPUT}"
          else
            ZIP_FILE="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
            if [[ -z "${ZIP_FILE}" ]]; then
              echo "❌ Keine *.zip im Repo-Root gefunden." >&2
              echo "Repo-Root Inhalt:" >&2
              ls -la >&2
              exit 1
            fi
          fi

          echo "✅ Verwende ZIP: ${ZIP_FILE}"
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_OUTPUT"

      - name: Entpacken in Repo-Root (mit Auto-Flatten wenn 1 Top-Level-Ordner)
        run: |
          set -euo pipefail

          ZIP_FILE="${{ steps.pick.outputs.zip_file }}"
          WORK="${RUNNER_TEMP}/unzip_work"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          echo "📦 Entpacke '${ZIP_FILE}' nach '${WORK}'..."
          unzip -q -o "${ZIP_FILE}" -d "${WORK}"

          echo "🔎 Inhalt nach Entpacken:"
          ls -la "${WORK}"

          # Auto-Flatten: wenn genau 1 Top-Level-Ordner drin ist, dessen Inhalt ins Root mergen
          shopt -s dotglob nullglob
          entries=("${WORK}"/*)

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            SRC="${entries[0]}"
            echo "📁 ZIP hat genau 1 Top-Level-Ordner: $(basename "${SRC}") -> flatten + merge in Repo-Root"
          else
            SRC="${WORK}"
            echo "📁 ZIP hat mehrere Top-Level-Items -> merge in Repo-Root"
          fi

          # Merge in Repo-Root (überschreibt gleiche Dateien), schützt .git und Workflows
          rsync -a \
            --exclude ".git/" \
            --exclude ".github/workflows/" \
            "${SRC}/" "./"

          echo "✅ Merge abgeschlossen. Repo-Root jetzt:"
          ls -la

      - name: Optional ZIP löschen
        if: env.DELETE_ZIP == 'true'
        run: |
          set -euo pipefail
          ZIP_FILE="${{ steps.pick.outputs.zip_file }}"
          rm -f "${ZIP_FILE}"
          echo "🗑️ ZIP gelöscht: ${ZIP_FILE}"

      - name: Optional commit + push der Änderungen
        if: env.COMMIT_CHANGES == 'true'
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "ℹ️ Keine Änderungen zum Commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Unzip archive into repository root [skip ci]"
          git push
          echo "✅ Änderungen committed & gepusht."
